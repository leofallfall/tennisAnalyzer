[project]
name = "tennis-api"
version = "0.1.0"
description = "FastAPI backend for the Tennis Performance Analyzer"
requires-python = ">=3.11,<3.14"
dependencies = [
  "tennis-cv",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.30",
  "pydantic>=2.7",
]

[project.scripts]
tpa-api = "tennis_api.main:run"

[tool.uv.sources]
tennis-cv = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tennis_api"]
