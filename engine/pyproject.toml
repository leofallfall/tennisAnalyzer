[project]
name = "tennis-cv"
version = "0.1.0"
description = "Tennis computer vision engine: video ingestion, quality, pose and (future) stroke biomechanics"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.7",
  "mediapipe>=0.10.20",
]
# OpenCV is provided by MediaPipe's own dependency (opencv-contrib-python).
# Declaring opencv-python-headless as well would install two conflicting cv2 builds.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tennis_cv"]
