[project]
name = "tennis-worker"
version = "0.1.0"
description = "Background worker that runs video analysis jobs outside the API process"
requires-python = ">=3.11,<3.14"
dependencies = ["tennis-cv", "tennis-api"]

[project.scripts]
tpa-worker = "tennis_worker.main:main"

[tool.uv.sources]
tennis-cv = { workspace = true }
tennis-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tennis_worker"]
